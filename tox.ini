[tox]
skipsdist = true
envlist = lint, mypy, py314
skip_missing_interpreters = True
ignore_basepython_conflict = True

[gh-actions]
python =
  3.14: lint, mypy, py314

[pytest]
asyncio_default_fixture_loop_scope=function

[testenv]
install_command = python -m pip install {opts} {packages}
commands =
  python -c "import homeassistant; from homeassistant.components import logger; logger._clear_logger_overwrites = lambda hass: None; import pytest; raise SystemExit(pytest.main())" --log-level=DEBUG --asyncio-mode=auto --timeout=30 --disable-socket --allow-hosts=127.0.0.1,::1,localhost --cov=custom_components/mail_and_packages/ --cov-report=xml {posargs}
deps =
    -r{toxinidir}/requirements_test.txt

[testenv:py314]
commands_pre =
    python -m pip install --no-deps pytest-homeassistant-custom-component==0.13.375
    pip-audit --local --strict --timeout 15 --progress-spinner off

[testenv:lint]
basepython = python3
deps =
    ruff==0.15.0
commands =
    ruff check --no-fix .
    ruff format --check .

[testenv:format]
basepython = python3
deps =
    ruff==0.15.0
commands =
    ruff format --check .

[testenv:mypy]
basepython = python3
ignore_errors = True
commands =
  mypy custom_components/mail_and_packages/
deps =
  -rrequirements_format.txt
