name: SDD-Light maintenance report
description: Shared read-only monitoring for fork and non-fork repositories
inputs:
  config:
    description: Path to project-specific YAML configuration
    required: true
  token:
    description: Read-only GitHub token for public API and prior report artifacts
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.13'
    - name: Install YAML parser
      shell: bash
      run: python -m pip install PyYAML==6.0.3 defusedxml==0.7.1
    - name: Find previous successful state for this configuration and ref
      id: state
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        MONITOR_CONFIG: ${{ inputs.config }}
        MONITOR_ACTION: ${{ github.action_path }}
      run: python "$MONITOR_ACTION/state_info.py"
    - name: Restore previous state
      if: steps.state.outputs.run_id != ''
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ steps.state.outputs.name }}
        path: .maintenance-state
        run-id: ${{ steps.state.outputs.run_id }}
        github-token: ${{ inputs.token }}
    - name: Produce source-cited report without issue or repository mutation
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        MONITOR_CONFIG: ${{ inputs.config }}
        MONITOR_ACTION: ${{ github.action_path }}
      run: python "$MONITOR_ACTION/monitor.py" --config "$MONITOR_CONFIG"
    - name: Save state only after complete successful report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ steps.state.outputs.name }}
        path: .maintenance-output/state.json
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 90
    - name: Publish report artifact even on source failure
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: maintenance-report
        path: |
          .maintenance-output/report.json
          .maintenance-output/report.md
        include-hidden-files: true
        retention-days: 30
    - name: Show report in run summary
      if: always()
      shell: bash
      run: |
        if test -f .maintenance-output/report.md; then
          cat .maintenance-output/report.md >> "$GITHUB_STEP_SUMMARY"
        fi
