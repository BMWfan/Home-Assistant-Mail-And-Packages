name: Maintenance monitor tests
on:
  pull_request:
    paths:
      - '.github/actions/maintenance-monitor/**'
      - '.github/workflows/maintenance-monitor*.yml'
      - '.github/maintenance-monitor.yml'
      - 'tests_maintenance/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 defusedxml==0.7.1
      - run: python -m unittest discover -s tests_maintenance -v
