name: Maintenance monitor (read-only)
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'
  push:
    branches: [feat/reusable-maintenance-monitor]
permissions:
  contents: read
  actions: read
concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 defusedxml==0.7.1
      - name: Test shared adapters with mocked sources
        run: python -m unittest discover -s tests_maintenance -v
      - uses: ./.github/actions/maintenance-monitor
        with:
          config: .github/maintenance-monitor.yml
          token: ${{ github.token }}
